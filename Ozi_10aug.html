fileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }


    document.getElementById("fileName").innerText = file.name;

    document.getElementById("errorMessage").innerText = "";


    const reader = new FileReader();


    reader.onload = function(e) {

        try {

            const data = new Uint8Array(e.target.result);


            const workbook = XLSX.read(
                data,
                {
                    type: "array",
                    cellDates: true
                }
            );


            const sheetName = workbook.SheetNames[0];


            const worksheet = workbook.Sheets[sheetName];


            uploadedRows = XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: "",
                    raw: false
                }
            );


            if (uploadedRows.length <= 1) {

                uploadedRows = [];

                showError(
                    "Excel file contains no attendance records."
                );

                return;

            }


            document.getElementById(
                "fileName"
            ).innerText =

                file.name + " — Ready to generate";


        }

        catch (error) {

            console.error(error);

            uploadedRows = [];

            showError(
                "Unable to process Excel file."
            );

        }

    };


    reader.readAsArrayBuffer(file);

});

/* ===============================
   ACTIVE HOUR
================================ */

function calculateActiveHour(
    punchIn,
    punchOut
) {

    if (!punchIn) {

        return "";

    }


    const start = parseExcelDate(punchIn);


    if (!start) {

        return "";

    }


    let end;


    /*
    PUNCH OUT NULL
    CURRENT IST - PUNCH IN
    */

    if (

        !punchOut ||

        String(punchOut)
            .trim()
            .toLowerCase() === "null"

    ) {

        end = getCurrentISTDate();

    }

    else {

        end = parseExcelDate(punchOut);

    }


    if (!end) {

        return "";

    }


    const difference =

        end.getTime() -

        start.getTime();


    if (difference < 0) {

        return "";

    }


    const totalSeconds =

        Math.floor(
            difference / 1000
        );


    const hours =

        Math.floor(
            totalSeconds / 3600
        );


    const minutes =

        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =

        totalSeconds % 60;


    return (

        String(hours).padStart(2, "0")

        + ":" +

        String(minutes).padStart(2, "0")

        + ":" +

        String(seconds).padStart(2, "0")

    );

}

/* ===============================
   SHIFT CALCULATION
================================ */

function calculateShift(punchIn) {

    const date = parseExcelDate(punchIn);

    if (!date) {
        return "Other Shift";
    }

    const minutes = date.getHours() * 60 + date.getMinutes();

    // 5 AM Shift : After 4:15 AM and Before 5:30 AM
    if (minutes >= 255 && minutes <= 330)
        return "5 AM";

    // 6 AM Shift : After 5:30 AM and Before 6:30 AM
    if (minutes >= 330 && minutes <= 390)
        return "6 AM";

    // 8 AM Shift : After 7:30 AM and Before 8:30 AM
    if (minutes >= 450 && minutes <= 510)
        return "8 AM";

    // 10 AM Shift : After 9:30 AM and Before 10:30 AM
    if (minutes >= 570 && minutes <= 630)
        return "10 AM";

    // 3 PM Shift : After 2:30 PM and Before 3:30 PM
    if (minutes >= 870 && minutes <= 930)
        return "3 PM";

    // 5 PM Shift : After 4:30 PM and Before 5:30 PM
    if (minutes >= 990 && minutes <= 1050)
        return "5 PM";

    return "Other Shift";
}
/* ===============================
   SHIFT VISIBILITY
================================ */

function isShiftCompleted(shift) {

    const now = getCurrentISTDate();

    const minutes = now.getHours() * 60 + now.getMinutes();

    switch (shift) {

        case "5 AM":
            return minutes >= 330;   // 5:30 AM

        case "6 AM":
            return minutes >= 390;   // 6:30 AM

        case "8 AM":
            return minutes >= 510;   // 8:30 AM

        case "10 AM":
            return minutes >= 630;   // 10:30 AM

        case "3 PM":
            return minutes >= 930;   // 3:30 PM

        case "5 PM":
            return minutes >= 1020;  // 5:30 PM

        case "Other Shift":
            return true;

        default:
            return false;
    }

}

/* ===============================
   CURRENT IST
================================ */

function getCurrentISTDate() {

    const now = new Date();


    const istParts =

        new Intl.DateTimeFormat(

            "en-CA",

            {

                timeZone: "Asia/Kolkata",

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }

        ).formatToParts(now);


    const parts = {};


    istParts.forEach(part => {

        parts[part.type] = part.value;

    });


    return new Date(

        Number(parts.year),

        Number(parts.month) - 1,

        Number(parts.day),

        Number(parts.hour),

        Number(parts.minute),

        Number(parts.second)

    );

}



/* ===============================
   DATE PARSER
================================ */

function parseExcelDate(value) {

    if (!value) {

        return null;

    }


    if (value instanceof Date) {

        return value;

    }


    const text = String(value).trim();


    const match = text.match(

        /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/

    );


    if (match) {

        return new Date(

            Number(match[1]),

            Number(match[2]) - 1,

            Number(match[3]),

            Number(match[4]),

            Number(match[5]),

            Number(match[6])

        );

    }


    const date = new Date(text);


    if (isNaN(date.getTime())) {

        return null;

    }


    return date;

}

async function downloadCapture(elementId, fileName) {

    if (reportData.length === 0) {
        alert("No report data available.");
        return;
    }

    reportData.forEach(item => {
        item.activeHour = calculateActiveHour(item.punchIn, item.punchOut);
    });

    calculateDifference();
    updateReportDate();

    await new Promise(r => setTimeout(r,150));

    const element = document.getElementById(elementId);

    // Save current styles
    const oldStyle = element.style.cssText;

    // Force element to shrink to content
    element.style.display = "inline-block";
    element.style.position = "absolute";
    element.style.left = "0";
    element.style.top = "0";
    element.style.margin = "0";
    element.style.padding = "0";

    const canvas = await html2canvas(element,{
        scale:3,
        backgroundColor:"#ffffff",
        useCORS:true,
        logging:false
    });
    // Create a new canvas with extra space at the bottom
const finalCanvas = document.createElement("canvas");

finalCanvas.width = canvas.width;
finalCanvas.height = canvas.height + 80;

const ctx = finalCanvas.getContext("2d");

// White background
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

// Draw original image
ctx.drawImage(canvas, 0, 0);

// Watermark
ctx.font = "bold 30px Segoe UI";
ctx.fillStyle = "#000000";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
    "POWERED BY SASA AUTOMATION | ZIPPEE",
    finalCanvas.width / 2,
    canvas.height + 40
);

    // Restore original styles
    element.style.cssText = oldStyle;

    const link = document.createElement("a");
    link.href = finalCanvas.toDataURL("image/png");
    link.download = fileName;
    link.click();
}

/* ===============================

================================ */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}
