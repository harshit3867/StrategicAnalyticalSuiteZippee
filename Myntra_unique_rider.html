<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zippee – Unique Rider Count Report</title>

<!-- XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- HTML2CANVAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
    --primary:#003f8c;
    --glass:rgba(255,255,255,.16);
    --shadow:0 8px 30px rgba(0,0,0,.25);
}

html,body{
    margin:0;
    padding:0;
    font-family:"Segoe UI",Arial;
}

body{
    background:url('Zippee.png') center/cover fixed no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.24);
    backdrop-filter:blur(6px);
    z-index:-1;
}

.header{
    background:linear-gradient(90deg,rgba(0,63,140,.85),rgba(0,89,179,.85));
    color:white;
    padding:18px 36px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    height:48px;
}

.card{
    background:var(--glass);
    backdrop-filter:blur(10px) saturate(120%);
    margin:30px auto;
    max-width:1300px;
    padding:30px;
    border-radius:18px;
    box-shadow:var(--shadow);
}

.title{
    font-size:22px;
    font-weight:700;
    color:var(--primary);
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
    align-items:center;
}

button,input{
    padding:10px 14px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    background:linear-gradient(135deg,#0A66C2,#0078FF);
    color:white;
    border:none;
    font-weight:700;
    cursor:pointer;
}

#reportContainer{
    margin-top:20px;
    overflow-x:auto;
}

#captureBox{
    position:relative;
    display:inline-block;
    padding:24px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

th,td{
    border:1px solid #ddd;
    padding:10px 12px;
    text-align:center;
    font-size:14px;
}

th{
    background:#003f8c;
    color:white;
}

tfoot td{
    font-weight:800;
    background:#e6efff;
}

.report-head{
    text-align:center;
}

.report-title{
    font-size:20px;
    font-weight:800;
}

.report-meta{
    font-size:14px;
    margin-top:6px;
}

.report-footer{
    text-align:center;
    margin-top:12px;
    font-size:12px;
    font-weight:700;
}

#loadingText{
    display:none;
    font-weight:700;
    color:black;
}
</style>
</head>

<body>

<div class="header">
    <h1>Zippee – Unique Rider Report</h1>
    <img class="logo" src="https://i.imgur.com/7yUVE8U.png">
</div>

<div class="card">

    <div class="title">Upload Rider Data</div>

    <div class="controls">

        <div id="loadingText">
            ⏳ Generating report, please wait...
        </div>

        <input type="file" id="sourceFile" accept=".csv,.xls,.xlsx">

        <button id="buildReport">
            Generate Report
        </button>

        <button id="downloadReport">
            Download Report
        </button>

        <input type="text" id="finder" placeholder="Search Store">

    </div>

    <div id="reportContainer">

        <div id="captureBox">

            <div class="report-head">
                <div class="report-title">
                    📥 Unique Rider Count
                </div>

                <div class="report-meta" id="metaInfo"></div>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Store</th>
                        <th>Riders</th>
                    </tr>
                </thead>

                <tbody id="grid"></tbody>

                <tfoot>
                    <tr>
                        <td colspan="2">Grand Total</td>
                        <td id="sumCell">0</td>
                        
                    </tr>
                </tfoot>

            </table>

            <div class="report-footer">
                Powered by SASA Automation | Zippee <> Data Analyst Team
            </div>

        </div>

    </div>

</div>

<script>

/* ------------------ DATA PIPELINE ------------------ */

let snapshot = [];

const normalize = x => x ? String(x).trim() : "";

/* ONLY THESE STORES WILL BE INCLUDED */

const APPROVED_STORES = new Set([
    "Kalyan Nagar_mnow",
    "Basaveshwar Nagar_mnow",
    "Jakkur_mnow",
    "Begur_mnow",
    "Brookfield_mnow",
    "JP nagar_mnow",
    "Sarjapur Road_mnow",
    "Manikonda_mnow",
    "Gachibowli_mnow",
    "Attapur_mnow",
    "Nizampet_mnow",
    "Hulimavu_mnow"
]);

document.getElementById("buildReport").addEventListener("click", ()=>{

    document.getElementById("loadingText").style.display = "block";

    const file = document.getElementById("sourceFile").files[0];

    if(!file){
        alert("Please upload a file");
        document.getElementById("loadingText").style.display = "none";
        return;
    }

    const reader = new FileReader();

    reader.onload = ev => {

        const workbook = file.name.endsWith(".csv")
            ? XLSX.read(ev.target.result,{type:"string"})
            : XLSX.read(new Uint8Array(ev.target.result),{type:"array"});

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet,{raw:false});

        snapshot = transform(rows);

        render(snapshot);

        stampTime();

        document.getElementById("loadingText").style.display = "none";
    };

    file.name.endsWith(".csv")
        ? reader.readAsText(file)
        : reader.readAsArrayBuffer(file);
});

/* ------------------ TRANSFORM ------------------ */

function transform(rows){

    const ledger = {};

    rows.forEach(row=>{

        const hub = normalize(row["Hub Name"]);

        const rider = normalize(row["Worker Code"]);

        

        if(!hub || !rider || !APPROVED_STORES.has(hub)) return;

        ledger[hub] ??= {};
        /* Unique rider count */

        ledger[hub][rider] = true;

        /* Minutes to Hours */


    });

    return Object.keys(ledger)

        .sort((a,b)=>a.localeCompare(b))

        .map(hub=>({

            hub,

            total:Object.keys(ledger[hub]).length,

            
        }));
}

/* ------------------ RENDER ------------------ */

function render(data){

    let html = "";

    let sum = 0;



    data.forEach((row,i)=>{

        sum += row.total;

        

        html += `
        <tr>
            <td>${i+1}</td>
            <td>${row.hub}</td>
            <td>${row.total}</td>
            
        </tr>`;
    });

    document.getElementById("grid").innerHTML = html ||

        `<tr><td colspan="3">No data</td></tr>`;

    document.getElementById("sumCell").innerText = sum;

    
}

/* ------------------ SEARCH ------------------ */

document.getElementById("finder").addEventListener("input",e=>{

    const q = e.target.value.toLowerCase();

    render(
        snapshot.filter(x =>
            x.hub.toLowerCase().includes(q)
        )
    );
});

/* ------------------ META ------------------ */

function stampTime(){

    const d = new Date();

    document.getElementById("metaInfo").innerText =
        `Date: ${d.toLocaleDateString("en-GB")} | Time: ${d.toLocaleTimeString()}`;
}

/* ------------------ DOWNLOAD REPORT ------------------ */

document.getElementById("downloadReport").addEventListener("click",()=>{

    const target = document.getElementById("captureBox");

    html2canvas(target,{
        scale:2,
        useCORS:true
    }).then(canvas=>{

        const link = document.createElement("a");

        link.download =
            `Unique_Rider_Report_${new Date().toISOString().slice(0,10)}.png`;

        link.href = canvas.toDataURL("image/png");

        link.click();
    });
});

</script>

</body>
</html>
