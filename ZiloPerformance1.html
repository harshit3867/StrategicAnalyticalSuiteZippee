<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zilo Performance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:
  radial-gradient(circle at top left,
  rgba(0,191,255,0.18),
  transparent 25%),

  radial-gradient(circle at top right,
  rgba(139,92,246,0.18),
  transparent 25%),

  linear-gradient(
    135deg,
    #081120,
    #0f1d36
  );

  color:#fff;
}
.container{padding:20px}
h1{margin-bottom:10px}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:20px;
  gap:15px;
}
input,select{
  background:#111827;
  color:white;
  border:1px solid #2d3748;
  padding:10px 14px;
  border-radius:10px;
}
.chart-box{
  margin-top:10px;
}
.filters{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
select{padding:8px;border-radius:6px;border:none}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{
  background:rgba(18,26,43,0.85);

  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.08);

  padding:20px;

  border-radius:18px;

  box-shadow:
    0 0 18px rgba(0,191,255,0.12),
    0 4px 18px rgba(0,0,0,0.35);

  transition:0.35s;
}
.card:hover{
  transform:translateY(-5px);

  box-shadow:
    0 0 30px rgba(0,191,255,0.35),
    0 0 60px rgba(139,92,246,0.15);
}
.card h3{font-size:12px;opacity:.7;margin:0}
.card h2{
  margin:10px 0 0;
  font-size:34px;
  font-weight:700;
}

.grid{
  display:grid;
  .grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(700px,1fr));
  gap:18px;
}
}
.chart-box{
  height:500px;

  background:rgba(18,26,43,0.82);

  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.06);

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 0 22px rgba(0,191,255,0.08),
    0 8px 20px rgba(0,0,0,0.35);
}
.chart-box canvas{width:100%!important;height:100%!important}
.title{font-size:14px;margin-bottom:6px}
h1{
  font-size:42px;

  font-weight:800;

  text-shadow:
    0 0 10px rgba(0,191,255,0.45),
    0 0 25px rgba(139,92,246,0.25);
}
</style>
</head>

<body>
<div class="container">

<div class="topbar">

  <h1>⚡ Zilo Performance Dashboard</h1>

  <div class="filters">

    <label>From:</label>
    <input type="date" id="fromDate">

    <label>To:</label>
    <input type="date" id="toDate">

    <label>Location:</label>

    <select id="locationFilter">
      <option value="All">All</option>
      <option value="Malad">Malad</option>
      <option value="Ghatkopar">Ghatkopar</option>
    </select>

  </div>

</div>
<div class="kpis">
<div class="card"><h3>Total Orders</h3><h2 id="orders"></h2></div>
<div class="card"><h3>Attainment %</h3><h2 id="att"></h2></div>
<div class="card"><h3>SLA %</h3><h2 id="sla"></h2></div>
<div class="card"><h3>Rider Attainment</h3><h2 id="rider"></h2></div>
<div class="card"><h3>Deep Pain</h3><h2 id="deep"></h2></div>
</div>

<div id="charts" class="grid"></div>

</div>

<script>
  Chart.register(ChartDataLabels);

const maladURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu4pYMSETMm4ZgQvAAXpI7UPxw9IqnBbexPS2WAu1y97FqUjtZ9o97JsROmgfYaOzv6M9hIBu8NtxD/pub?gid=0&single=true&output=csv";
const ghatURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu4pYMSETMm4ZgQvAAXpI7UPxw9IqnBbexPS2WAu1y97FqUjtZ9o97JsROmgfYaOzv6M9hIBu8NtxD/pub?gid=2009809733&single=true&output=csv";

let storeData = {};
let charts = [];
const todayObj = new Date();

const firstDay = new Date(
  todayObj.getFullYear(),
  todayObj.getMonth(),
  1
);

const todayDate = todayObj.toISOString().split('T')[0];

document.getElementById('fromDate').value =
  firstDay.toISOString().split('T')[0];

document.getElementById('toDate').value =
  todayDate;

const percent = v => {
  if(!v || v.includes('#DIV')) return 0;
  return parseFloat(v.toString().replace('%','')) || 0;
};

function load(url,name){
  return new Promise(res=>{
    Papa.parse(url,{
      download:true,
      header:true,
      complete:(r)=>{
        res({name,data:r.data.filter(x=>x.Date)});
      }
    });
  });
}

Promise.all([load(maladURL,'Malad'),load(ghatURL,'Ghatkopar')]).then(r=>{
  r.forEach(x=>storeData[x.name]=x.data);
  render('All');
  document.getElementById('locationFilter').addEventListener('change',e=>render(e.target.value));
  document.getElementById('fromDate')
.addEventListener('change',()=>{

  render(
    document.getElementById('locationFilter').value
  );

});

document.getElementById('toDate')
.addEventListener('change',()=>{

  render(
    document.getElementById('locationFilter').value
  );

});
});

function clearCharts(){
  charts.forEach(c=>c.destroy());
  charts=[];
  document.getElementById('charts').innerHTML='';
}

function addChart(title,config){
  const box=document.createElement('div');
  box.className='chart-box';
  box.innerHTML=`<div class="title">${title}</div><canvas></canvas>`;
  document.getElementById('charts').appendChild(box);
  config.options = {
  ...config.options,
  scales: {
    x: {
      ticks: {
        autoSkip: false,   // 🔥 sab dates dikhayega
        maxRotation: 45,
        minRotation: 45
      }
    }
  },
  plugins: {
    datalabels: {
      color: '#fff',
      anchor: 'end',
      align: 'top',
      font: { size: 10 }
    }
  }
};
config.options = config.options || {};

config.options.maintainAspectRatio = false;

config.options.layout = {
  padding: {
    bottom: 25
  }
};
config.options.scales = {
  x: {
    ticks: {
  autoSkip: true,
  maxTicksLimit: 12,
  maxRotation: 45,
  minRotation: 45,
  color: '#ffffff',
  padding: 10,
  font: {
    size: 10
  }
},
    grid: {
      color: 'rgba(255,255,255,0.1)'
    }
  },
  y: {
    ticks: {
      color: '#ffffff'   // ✅ Y axis white
    },
    grid: {
      color: 'rgba(255,255,255,0.1)'
    }
  }
};

config.options.plugins = config.options.plugins || {};

config.options.plugins.legend = {
  labels: {
    color: '#ffffff'   // ✅ legend white
  }
};

config.options.plugins.datalabels = {
  color: '#ffffff',
  anchor: 'end',
  align: 'top',
  font: {
    size: 10
  }
};
const c = new Chart(box.querySelector('canvas'), config);
  
  charts.push(c);
}

// KPI FIX (ONLY VALID DATA)
function kpis(filter){

  let tot=0,att=0,sla=0,rider=0,deep=0,n=0;

  const stores =
    filter==='All'
    ? ['Malad','Ghatkopar']
    : [filter];

  const fromDate =
    new Date(document.getElementById('fromDate').value);

  const toDate =
    new Date(document.getElementById('toDate').value);

  stores.forEach(s=>{

    storeData[s].forEach(r=>{

      if(!r["Actual Order"]) return;

      const rowDate = parseSheetDate(r.Date);

      if(
        rowDate < fromDate ||
        rowDate > toDate
      ) return;

      tot += +r["Actual Order"] || 0;

      att += percent(r["Attainment %"]);

      sla += percent(r["SLA %"]);

      rider += percent(r["Rider Attainment"]);

      deep += +r["Deep Pain"] || 0;

      n++;

    });

  });

  document.getElementById('orders').innerText = tot;

  document.getElementById('att').innerText =
    (att/n).toFixed(1)+'%';

  document.getElementById('sla').innerText =
    (sla/n).toFixed(1)+'%';

  document.getElementById('rider').innerText =
    (rider/n).toFixed(1)+'%';

  document.getElementById('deep').innerText = deep;
}
function parseSheetDate(dateStr){

  const months = {
    Jan:0, Feb:1, Mar:2, Apr:3,
    May:4, Jun:5, Jul:6, Aug:7,
    Sep:8, Oct:9, Nov:10, Dec:11
  };

  const [day,month] = dateStr.split('-');

  return new Date(
    new Date().getFullYear(),
    months[month],
    parseInt(day)
  );
}
function render(filter){

  clearCharts();
  kpis(filter);

  const today=new Date().getDate();
  const fromDate =
  new Date(document.getElementById('fromDate').value);

const toDate =
  new Date(document.getElementById('toDate').value);

  // 🔥 PERFECT FILTER
  const mData = storeData['Malad'].filter(r=>{

  if(!r["Actual Order"]) return false;

  const rowDate = parseSheetDate(r.Date);

  return rowDate >= fromDate &&
         rowDate <= toDate;
});
  const gData = storeData['Ghatkopar'].filter(r=>{

  if(!r["Actual Order"]) return false;

  const rowDate = parseSheetDate(r.Date);

  return rowDate >= fromDate &&
         rowDate <= toDate;
});
  const labels =
  filter === 'Malad'
  ? mData.map(r=>r.Date)
  : filter === 'Ghatkopar'
  ? gData.map(r=>r.Date)
  : [...new Set([
      ...mData.map(r=>r.Date),
      ...gData.map(r=>r.Date)
    ])];

  const getData = store => store==='Malad'?mData:gData;

  const map = (store,key)=> getData(store).map(r=>{
    if(key==='PO') return +r["Projected Order"]||0;
    if(key==='AO') return +r["Actual Order"]||0;
    if(key==='SLA') return percent(r["SLA %"]);
    if(key==='SLAT') return percent(r["SLA Target"]);
    if(key==='RA') return percent(r["Rider Attainment"]);
    if(key==='PR') return +r["Projected Rider"]||0;
    if(key==='AR') return +r["Actual Rider"]||0;
    if(key==='B') return +r["Breach(>15 min)"]||0;
    if(key==='DP') return +r["Deep Pain"]||0;
  });

  if(filter==='All'){

    addChart('📊 Projected Orders Comparison',{
      type:'line',
      data:{labels,datasets:[
        {label:'Malad',data:map('Malad','PO')},
        {label:'Ghatkopar',data:map('Ghatkopar','PO')}
      ]}
    });

    addChart('⏱️ SLA Comparison',{
      type:'line',
      data:{labels,datasets:[
        {label:'Malad',data:map('Malad','SLA')},
        {label:'Ghatkopar',data:map('Ghatkopar','SLA')}
      ]}
    });

    addChart('🚴 Rider Attainment',{
      type:'line',
      data:{labels,datasets:[
        {label:'Malad',data:map('Malad','RA')},
        {label:'Ghatkopar',data:map('Ghatkopar','RA')}
      ]}
    });

    addChart('⚠️ Breach',{
      type:'bar',
      data:{labels,datasets:[
        {label:'Malad',data:map('Malad','B')},
        {label:'Ghatkopar',data:map('Ghatkopar','B')}
      ]}
    });

    addChart('🔍 Deep Pain',{
      type:'bar',
      data:{labels,datasets:[
        {label:'Malad',data:map('Malad','DP')},
        {label:'Ghatkopar',data:map('Ghatkopar','DP')}
      ]}
    });

  } else {

    addChart('📦 Orders',{
      type:'line',
      data:{labels,datasets:[
        {label:'Projected',data:map(filter,'PO')},
        {label:'Actual',data:map(filter,'AO')}
      ]}
    });

    addChart('🎯 SLA',{
      type:'line',
      data:{labels,datasets:[
        {label:'SLA %',data:map(filter,'SLA')},
        {label:'Target',data:map(filter,'SLAT')}
      ]}
    });

    addChart('🚴 Riders',{
      type:'line',
      data:{labels,datasets:[
        {label:'Projected',data:map(filter,'PR')},
        {label:'Actual',data:map(filter,'AR')}
      ]}
    });

    addChart('⚠️ Breach',{
      type:'bar',
      data:{labels,datasets:[
        {label:'Breach Orders',data:map(filter,'B')}
      ]}
    });

    addChart('🔍 Deep Pain',{
      type:'bar',
      data:{labels,datasets:[
        {label:'Deep Pain',data:map(filter,'DP')}
      ]}
    });

  }
}

</script>
</body>
</html>
